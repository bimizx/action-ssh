name: Public SSH Debug Session

on:
  workflow_dispatch:  # 手动触发

jobs:
  ssh-debug:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@main

    - name: Start SSH session with tmate
      uses: mxschmitt/action-tmate@master

    - name: Keep session alive
      run: |
        echo "SSH 会话已启动，等待连接..."
        sleep 12h
